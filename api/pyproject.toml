[project]
name = "shortlist"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "mcp==2.3.0",
  "armoriq-sdk==0.6.10",
  "sqlalchemy>=2.1",
  "psycopg[binary]>=3.3",
  "openai>=3.31",
  "httpx>=0.28",
  "sse-starlette>=3.5",
  "pydantic>=2.14",
  "pydantic-settings>=2.6",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shortlist"]
